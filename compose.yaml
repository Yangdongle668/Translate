name: translate
services:
  translate:
    build: .
    init: true
    environment:
      TRANSLATE_ALLOW_ANONYMOUS: "true"
      TRANSLATE_API_TOKEN: "${TRANSLATE_API_TOKEN:-}"
    ports:
      - "${TRANSLATE_BIND_ADDRESS:-0.0.0.0}:${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
