name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  docker:
    name: Verify Docker deployment
    runs-on: ubuntu-latest
    steps:
      - name: Deploy using the published script
        env:
          TRANSLATE_REF: ${{ github.ref_name }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/deploy.sh" -o deploy.sh
          bash deploy.sh
      - name: Check health and unauthenticated translation
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const health = await fetch('http://127.0.0.1:3000/health', { signal: AbortSignal.timeout(5_000) });
          assert.equal(health.status, 200);
          assert.deepEqual(await health.json(), { status: 'ok' });

          const response = await fetch('http://127.0.0.1:3000/v1/translate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: 'Hello, world!', target: 'zh-CN' }),
            signal: AbortSignal.timeout(14_000),
          });
          const result = await response.json();
          if ([429, 502, 504].includes(response.status) && result.error?.code?.startsWith('UPSTREAM_')) {
            console.log('::warning::Live Google translation unavailable: ' + result.error.code);
          } else {
            assert.equal(response.status, 200);
            assert.equal(result.target, 'zh-CN');
            assert.match(result.translatedText, /\p{Script=Han}/u);
            console.log('Google translation: ' + result.translatedText);
          }
          JS
      - name: Show deployment logs
        if: failure() && hashFiles('Translate/compose.yaml') != ''
        run: docker compose -f Translate/compose.yaml logs

  windows:
    name: Build and publish Windows client
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build portable client
        shell: pwsh
        run: ./client/build.ps1
      - name: Publish Translate.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" './client/dist/Translate.exe' --verify-tag --title "Translate $env:GITHUB_REF_NAME" --notes '下载 Translate.exe。在服务器地址填入部署 IP，再输入文本即可翻译。'
